[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-web-scraper"
version = "0.1.0"
description = "MCP server for web scraping with BeautifulSoup and Ollama/DeepSeek analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.6,<2",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "ollama>=0.4",
  "pydantic-settings>=2.0",
  "uvicorn>=0.30",
  "starlette>=0.37",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "respx>=0.21",
]

[project.scripts]
mcp-web-scraper = "mcp_web_scraper.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_web_scraper"]

[tool.hatch.build.targets.wheel.sources]
"src/mcp_web_scraper" = "mcp_web_scraper"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
