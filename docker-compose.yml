services:
  mcp-web-scraper:
    build: .
    image: ghcr.io/${GITHUB_REPOSITORY:-local/mcp-web-scraper}:latest
    ports:
      - "${MCP_BIND:-127.0.0.1}:${MCP_PORT:-8000}:8000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
