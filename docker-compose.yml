services:
  mcp-web-scraper:
    build: .
    image: ghcr.io/${GITHUB_REPOSITORY:-local/mcp-web-scraper}:latest
    container_name: mcp-web-scraper
    ports:
      # MCP_BIND controls which host interfaces accept connections (not MCP_HOST).
      # Use 0.0.0.0 when Odysseus or other containers reach MCP via the host LAN IP.
      - "${MCP_BIND:-0.0.0.0}:${MCP_PORT:-8000}:8000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
